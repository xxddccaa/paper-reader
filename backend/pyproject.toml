[project]
name = "paper-reader-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "uvicorn[standard]==0.34.2", "SQLAlchemy==2.0.40",
  "psycopg[binary]==3.2.6", "alembic==1.15.2", "pydantic-settings==2.15.0",
  "cryptography==50.0.2", "argon2-cffi==23.1.0", "python-multipart==0.0.32",
  "httpx==0.28.1", "beautifulsoup4==4.13.4", "PyMuPDF==1.25.5",
  "pdfplumber==0.11.10", "pypdfium2==5.14.0", "CairoSVG==2.8.2"
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
docling = ["docling==2.138.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
